name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest ruff
      - run: ruff check .
      - run: pytest

      # TODO: Temporarily disabled pytest to resolve environment-specific CI failures 
      # for portfolio showcase. Unit tests are still present in the /tests directory.
      # - run: pytest
